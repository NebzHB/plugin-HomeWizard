<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200" role="img" aria-label="Plug-In Battery">
<style>
.hand{animation:hand 3.2s ease-in-out infinite}
.btn{transform-origin:146px 44px;animation:btn 3.2s ease-in-out infinite}
.ring{stroke-dasharray:101;animation:ring 3.2s linear infinite}
.led{animation:led 3.2s linear infinite}
.ripple{animation:ripple 3.2s ease-out infinite}
.hold{animation:holdlabel 3.2s linear infinite}
@keyframes hand{0%,15%{transform:translate(26px,30px)}32%,44%{transform:translate(0,0)}62%,100%{transform:translate(26px,30px)}}
@keyframes btn{0%,31%{transform:scale(1)}34%,44%{transform:scale(.86)}48%,100%{transform:scale(1)}}
@keyframes ring{0%,100%{opacity:0}}
@keyframes led{0%,44%{opacity:.25}50%{opacity:1}58%{opacity:.25}66%{opacity:1}74%{opacity:.25}82%{opacity:1}90%,100%{opacity:.25}}
@keyframes ripple{0%,43%{r:10px;opacity:0}44%{r:10px;opacity:.55}80%,100%{r:32px;opacity:0}}
@keyframes holdlabel{0%,24%{opacity:0}30%,72%{opacity:1}80%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.hand,.btn,.ring,.led,.ripple,.hold{animation:none}.hand{transform:translate(0,0)}.hold{opacity:1}}
</style>
<defs><clipPath id="panel"><rect x="4" y="4" width="252" height="192" rx="18"/></clipPath></defs>
<rect x="4" y="4" width="252" height="192" rx="18" fill="#eef1f5"/>
<g clip-path="url(#panel)">
<rect x="86" y="14" width="88" height="172" rx="14" fill="#fff" stroke="#aab2bd" stroke-width="2.5"/>
<rect x="100" y="78" width="60" height="94" rx="6" fill="#eef1f5" stroke="#aab2bd" stroke-width="2"/>
<g fill="#94ca02"><rect x="106" y="150" width="48" height="16" rx="3"/><rect x="106" y="130" width="48" height="16" rx="3"/><rect x="106" y="110" width="48" height="16" rx="3"/></g><rect x="106" y="90" width="48" height="16" rx="3" fill="#d9dee5"/>
<path d="M40 186h180" stroke="#b8c0cb" stroke-width="4" stroke-linecap="round"/>
<circle class="led" cx="108" cy="44" r="5" fill="#2e9bff"/><circle cx="108" cy="44" r="5" fill="none" stroke="#1b6fc2" stroke-width="1.5"/>
<circle class="ripple" cx="146" cy="44" r="10" fill="none" stroke="#94ca02" stroke-width="3" opacity="0"/>
<g class="btn"><circle cx="146" cy="44" r="11" fill="#94ca02" stroke="#6f9a00" stroke-width="2"/><circle cx="146" cy="44" r="5" fill="#b9e04a"/></g>
<circle class="ring" cx="146" cy="44" r="16" fill="none" stroke="#2f3640" stroke-width="3" stroke-linecap="round" transform="rotate(-90 146 44)" opacity="0"/>

<g class="hand"><g transform="translate(146 44) rotate(-28)">
<rect x="-25" y="46" width="52" height="46" rx="16" fill="#fff" stroke="#4a5360" stroke-width="3"/>
<ellipse cx="-27" cy="60" rx="9" ry="15" fill="#fff" stroke="#4a5360" stroke-width="3" transform="rotate(-18 -27 60)"/>
<rect x="-10" y="-3" width="20" height="66" rx="10" fill="#fff" stroke="#4a5360" stroke-width="3"/>
<rect x="-5" y="2" width="10" height="9" rx="4" fill="#dfe4ea"/>
<path d="M4 62v18M16 64v16" stroke="#4a5360" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</g></g>
</g>
</svg>
