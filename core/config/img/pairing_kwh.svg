<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200" role="img" aria-label="kWh Meter">
<style>
.hand{animation:hand 4.2s ease-in-out infinite}
.btn{transform-origin:146px 124px;animation:btn 4.2s ease-in-out infinite}
.ring{stroke-dasharray:101;animation:ring 4.2s linear infinite}
.led{animation:led 4.2s linear infinite}
.ripple{animation:ripple 4.2s ease-out infinite}
.hold{animation:holdlabel 4.2s linear infinite}
@keyframes hand{0%,12%{transform:translate(26px,30px)}26%,74%{transform:translate(0,0)}90%,100%{transform:translate(26px,30px)}}
@keyframes btn{0%,25%{transform:scale(1)}28%,74%{transform:scale(.86)}78%,100%{transform:scale(1)}}
@keyframes ring{0%,27%{stroke-dashoffset:101;opacity:0}28%{opacity:1}72%{stroke-dashoffset:0;opacity:1}80%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes led{0%,74%{opacity:.25}78%{opacity:1}84%{opacity:.25}90%{opacity:1}96%,100%{opacity:.25}}
@keyframes ripple{0%,74%{r:10px;opacity:0}75%{r:10px;opacity:.55}100%{r:30px;opacity:0}}
@keyframes holdlabel{0%,24%{opacity:0}30%,72%{opacity:1}80%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.hand,.btn,.ring,.led,.ripple,.hold{animation:none}.hand{transform:translate(0,0)}.hold{opacity:1}}
</style>
<defs><clipPath id="panel"><rect x="4" y="4" width="252" height="192" rx="18"/></clipPath></defs>
<rect x="4" y="4" width="252" height="192" rx="18" fill="#eef1f5"/>
<g clip-path="url(#panel)">
<rect x="40" y="96" width="180" height="10" rx="3" fill="#b8c0cb"/>
<rect x="84" y="20" width="92" height="160" rx="6" fill="#fff" stroke="#aab2bd" stroke-width="2.5"/>
<rect x="84" y="20" width="92" height="26" rx="6" fill="#d9dee5" stroke="#aab2bd" stroke-width="2.5"/><rect x="84" y="154" width="92" height="26" rx="6" fill="#d9dee5" stroke="#aab2bd" stroke-width="2.5"/>
<g fill="#8a94a1"><circle cx="100" cy="33" r="5"/><circle cx="120" cy="33" r="5"/><circle cx="140" cy="33" r="5"/><circle cx="160" cy="33" r="5"/><circle cx="100" cy="167" r="5"/><circle cx="120" cy="167" r="5"/><circle cx="140" cy="167" r="5"/><circle cx="160" cy="167" r="5"/></g>
<rect x="96" y="58" width="68" height="34" rx="4" fill="#2f3640"/><text x="130" y="81" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#9be7a0">123.4</text>
<circle class="led" cx="104" cy="124" r="5" fill="#2e9bff"/><circle cx="104" cy="124" r="5" fill="none" stroke="#1b6fc2" stroke-width="1.5"/>
<circle class="ripple" cx="146" cy="124" r="10" fill="none" stroke="#94ca02" stroke-width="3" opacity="0"/>
<g class="btn"><circle cx="146" cy="124" r="11" fill="#94ca02" stroke="#6f9a00" stroke-width="2"/><circle cx="146" cy="124" r="5" fill="#b9e04a"/></g>
<circle class="ring" cx="146" cy="124" r="16" fill="none" stroke="#2f3640" stroke-width="3" stroke-linecap="round" transform="rotate(-90 146 124)" opacity="0"/>
<g class="hold"><rect x="170" y="90" width="50" height="22" rx="11" fill="#2f3640"/><text x="195" y="105" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" fill="#fff">1–3 s</text></g>
<g class="hand"><g transform="translate(146 124) rotate(-28)">
<rect x="-25" y="46" width="52" height="46" rx="16" fill="#fff" stroke="#4a5360" stroke-width="3"/>
<ellipse cx="-27" cy="60" rx="9" ry="15" fill="#fff" stroke="#4a5360" stroke-width="3" transform="rotate(-18 -27 60)"/>
<rect x="-10" y="-3" width="20" height="66" rx="10" fill="#fff" stroke="#4a5360" stroke-width="3"/>
<rect x="-5" y="2" width="10" height="9" rx="4" fill="#dfe4ea"/>
<path d="M4 62v18M16 64v16" stroke="#4a5360" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</g></g>
</g>
</svg>
