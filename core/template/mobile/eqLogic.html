<div class="eqLogic eqLogic-widget hw-widget #eqLogic_class# #class#" data-eqType="#eqType#" data-eqLogic_id="#id#" data-eqLogic_uid="#uid#" data-version="#version#" data-translate-category="#translate_category#" data-category="#category#" data-tags="#tags#" data-hw_confirm="#hw_confirm#" style="width:#width#;height:#height#;#style#">
	<style>
		.hw-widget { min-width: 250px; width: 100%; position: relative; }
		.hw-widget .hw-body { padding: 4px 10px 8px 10px; text-align: left; }
		.hw-widget .hw-head { display: flex; align-items: center; gap: 10px; }
		.hw-widget .hw-img { width: 54px; height: 54px; object-fit: contain; flex: none; }
		.hw-widget .hw-main { flex: 1; min-width: 0; }
		.hw-widget .hw-main-value { font-size: 30px; font-weight: 600; line-height: 1.1; white-space: nowrap; }
		.hw-widget .hw-main-value small { font-size: 14px; font-weight: 400; opacity: .7; }
		.hw-widget .hw-main-label { font-size: 12px; opacity: .75; }
		.hw-widget .hw-lbl-export, .hw-widget.hw-export .hw-lbl-import { display: none; }
		.hw-widget.hw-export .hw-lbl-export { display: inline; }
		.hw-widget.hw-export .hw-main-value { color: var(--al-success-color, #4caf50); }
		.hw-widget .hw-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
		.hw-widget .hw-tile { border-radius: 6px; padding: 4px 8px; background: rgba(127,127,127,.12); min-width: 0; }
		.hw-widget .hw-tile-label { font-size: 11px; opacity: .7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
		.hw-widget .hw-tile-value { font-size: 15px; font-weight: 600; white-space: nowrap; }
		.hw-widget .hw-tile-value small { font-size: 11px; font-weight: 400; opacity: .7; }
		.hw-widget .hw-bar { height: 5px; border-radius: 3px; background: rgba(127,127,127,.25); margin-top: 3px; overflow: hidden; }
		.hw-widget .hw-bar > div { height: 100%; width: 0; background: var(--al-success-color, #4caf50); transition: width .4s; }
		.hw-widget table.hw-phases { width: 100%; margin-top: 8px; font-size: 12px; border-collapse: collapse; }
		.hw-widget table.hw-phases td { padding: 2px 4px; text-align: right; white-space: nowrap; background: transparent; border: 0; }
		.hw-widget table.hw-phases td:first-child { text-align: left; opacity: .7; }
		.hw-widget table.hw-phases tr + tr td { border-top: 1px solid rgba(127,127,127,.2); }
		.hw-widget .hw-foot { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 11px; opacity: .8; }
		.hw-widget .hw-foot .hw-grow { flex: 1; }
		.hw-widget .hw-foot .hw-more { margin-left: -6px; }
		.hw-widget .hw-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--al-danger-color, #e53935); vertical-align: middle; }
		.hw-widget .hw-dot.hw-on { background: var(--al-success-color, #4caf50); }
		.hw-widget .hw-lbl-offline, .hw-widget .hw-offline .hw-lbl-online { display: none; }
		.hw-widget .hw-offline .hw-lbl-offline { display: inline; }
		.hw-widget .hw-switch { cursor: pointer; font-size: 26px; opacity: .45; flex: none; }
		.hw-widget .hw-switch.hw-on { opacity: 1; color: var(--al-success-color, #4caf50); }
		.hw-widget .hw-actions { margin-top: 8px; text-align: center; }
		.hw-widget .hw-more { display: inline-block; min-width: 16px; padding: 0 3px; text-align: center; font-size: 13px; }
		.hw-widget .hw-popup { display: none; position: fixed; z-index: 1050; max-height: 60vh; max-width: 92vw; overflow: auto; padding: 6px 8px; border-radius: 6px; font-size: 12px; text-align: left; color: #333; background: #fff; border: 1px solid rgba(127,127,127,.4); box-shadow: 0 4px 14px rgba(0,0,0,.35); }
		.hw-widget .hw-popup.hw-open { display: block; }
		.hw-widget .hw-popup table { border-collapse: collapse; color: inherit; font-size: inherit; }
		.hw-widget .hw-popup td { padding: 2px 6px; white-space: nowrap; background: transparent; border: 0; }
		.hw-widget .hw-popup td:last-child { text-align: right; font-weight: 600; }
		.hw-widget .hw-popup tr + tr td { border-top: 1px solid rgba(127,127,127,.2); }
		.hw-widget .hw-waiting { margin-top: 8px; font-size: 12px; opacity: .8; }
		.hw-widget .hw-confirm { position: absolute; left: 6px; right: 6px; bottom: 6px; z-index: 20; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--al-danger-color, #e53935); box-shadow: 0 4px 14px rgba(0,0,0,.35); text-align: left; }
		.hw-widget .hw-confirm-text { font-size: 13px; margin-bottom: 8px; white-space: normal; }
		.hw-widget .hw-confirm-buttons { display: flex; justify-content: flex-end; gap: 6px; }
		.hw-widget .hw-confirm button { -webkit-appearance: none; appearance: none; display: inline-block; width: auto; min-height: 0; height: 28px; margin: 0; padding: 0 12px; border: 0; border-radius: 4px; font-size: 13px; line-height: 28px; font-family: inherit; text-transform: none !important; text-shadow: none; box-shadow: none; cursor: pointer; color: inherit; background: rgba(127,127,127,.25); }
		.hw-widget .hw-confirm button.hw-confirm-ok { color: #fff; background: var(--al-danger-color, #e53935); }
	</style>
	<center class="widget-name">
		<span class="warning" title="#alert_name#"><i class='#alert_icon#'></i></span>
		<span class="reportModeVisible">#name_display# <span class="object_name">#object_name#</span></span>
		<a href="#eqLink#" class="reportModeHidden">#name_display# <span class="object_name">#object_name#</span></a>
	</center>
	<div class="hw-body">
		<div class="hw-head">
			<img class="hw-img" src="#hw_image#" alt=""/>
			<div class="hw-main">#hw_main#</div>
			#hw_switch#
		</div>
		#hw_tiles#
		#hw_phases#
		#hw_actions#
		<div class="hw-foot">#hw_foot#</div>
		#hw_others#
	</div>
	<script>
		(function() {
			var root = document.querySelector('.eqLogic[data-eqLogic_uid="#uid#"]');
			if (!root) return;
			if (typeof jeedom.cmd.addUpdateFunction !== 'function') { // avant 4.3
				jeedom.cmd.addUpdateFunction = function(id, func) {
					jeedom.cmd.update[id] = func;
				};
			}
			var format = function(value, decimals) {
				if (value === '' || value === null || value === undefined) return '—';
				var number = parseFloat(value);
				if (isNaN(number)) return value;
				return number.toLocaleString(undefined, {maximumFractionDigits: decimals});
			};
			var apply = function(el, value) {
				var root = el.closest('.hw-widget');
				var kind = el.getAttribute('data-hw_kind');
				var number = parseFloat(value);
				switch (kind) {
					case 'online':
						el.parentNode.classList.toggle('hw-offline', number != 1);
						el.classList.toggle('hw-on', number == 1);
						break;
					case 'switch':
						el.classList.toggle('hw-on', number == 1);
						break;
					case 'bar':
						el.style.width = Math.max(0, Math.min(100, number || 0)) + '%';
						break;
					case 'text':
						el.textContent = (value === '' || value === null || value === undefined) ? '—' : value;
						break;
					case 'power': // négatif = injection : valeur absolue, le libellé et la couleur changent
						root.classList.toggle('hw-export', number < 0);
						el.textContent = format(isNaN(number) ? value : Math.abs(number), 0);
						break;
					default:
						el.textContent = format(value, parseInt(el.getAttribute('data-hw_dec')) || 0);
				}
			};
			var ids = {};
			root.querySelectorAll('[data-hw_cmd]').forEach(function(el) {
				ids[el.getAttribute('data-hw_cmd')] = true;
				apply(el, el.getAttribute('data-hw_value'));
			});
			Object.keys(ids).forEach(function(id) {
				// Le core ignore une fonction identique déjà enregistrée pour la commande : après un redessin du widget c'est
				// donc l'ancienne qui reste. Elle cherche les éléments dans la page à chaque valeur, jamais ceux d'avant.
				jeedom.cmd.addUpdateFunction(id, function(_options) {
					var value = (_options.value !== undefined) ? _options.value : _options.display_value;
					document.querySelectorAll('.hw-widget [data-hw_cmd="' + id + '"]').forEach(function(el) {
						apply(el, value);
					});
				});
			});
			var more = root.querySelector('.hw-more');
			var popup = root.querySelector('.hw-popup');
			if (more && popup) {
				more.addEventListener('click', function(event) {
					event.stopPropagation();
					if (popup.classList.toggle('hw-open')) { // sous le bouton, sans sortir de l'écran
						var style = window.getComputedStyle(root); // mêmes couleurs que le widget, quel que soit le thème
						if (style.backgroundColor && style.backgroundColor != 'transparent' && style.backgroundColor.indexOf('rgba(0, 0, 0, 0)') == -1) {
							popup.style.backgroundColor = style.backgroundColor;
							popup.style.color = style.color;
						}
						var rect = more.getBoundingClientRect();
						popup.style.left = Math.max(4, Math.min(rect.left, window.innerWidth - popup.offsetWidth - 4)) + 'px';
						popup.style.top = Math.max(4, Math.min(rect.bottom + 4, window.innerHeight - popup.offsetHeight - 4)) + 'px';
					}
				});
				popup.addEventListener('click', function(event) {
					event.stopPropagation();
				});
				var close = function() {
					if (!document.body.contains(root)) { // widget redessiné
						document.removeEventListener('click', close);
						window.removeEventListener('scroll', close, true);
						return;
					}
					popup.classList.remove('hw-open');
				};
				document.addEventListener('click', close);
				window.addEventListener('scroll', close, true);
			}
			// Actions à confirmer : message propre à chaque commande. jeeDialog sur le dashboard desktop quand son style est chargé,
			// sinon (mobile, style absent) un bandeau dans le widget. La commande n'est envoyée qu'au clic sur Confirmer.
			var confirm = {cmds: {}};
			try { confirm = JSON.parse(root.getAttribute('data-hw_confirm')) || confirm; } catch (e) {}
			var dialogStyled = function() {
				if (typeof jeeDialog === 'undefined' || typeof jeeDialog.confirm !== 'function') return false;
				if (jeedom.display && jeedom.display.version == 'mobile') return false;
				var probe = document.createElement('div');
				probe.className = 'jeeDialog';
				probe.style.visibility = 'hidden';
				document.body.appendChild(probe);
				var styled = window.getComputedStyle(probe).position != 'static';
				probe.remove();
				return styled;
			};
			var ask = function(message, onConfirm) {
				if (dialogStyled()) {
					jeeDialog.confirm(message, function(result) {
						if (result) onConfirm();
					});
					return;
				}
				var old = root.querySelector('.hw-confirm');
				if (old) old.remove();
				var bar = document.createElement('div');
				bar.className = 'hw-confirm';
				var text = document.createElement('div');
				text.className = 'hw-confirm-text';
				text.textContent = message;
				bar.appendChild(text);
				var buttons = document.createElement('div');
				buttons.className = 'hw-confirm-buttons';
				var button = function(label, cls, action) {
					var el = document.createElement('button');
					el.type = 'button';
					el.className = cls;
					el.setAttribute('data-role', 'none'); // jQuery Mobile ne doit pas le transformer
					el.textContent = label;
					el.addEventListener('click', function(event) {
						event.stopPropagation();
						event.preventDefault();
						if (!bar.parentNode) return; // bandeau déjà remplacé ou abandonné
						clearTimeout(timer);
						bar.remove();
						if (action) action();
					});
					buttons.appendChild(el);
				};
				button(confirm.cancel || 'Annuler', 'hw-confirm-cancel');
				button(confirm.ok || 'OK', 'hw-confirm-ok', onConfirm);
				bar.appendChild(buttons);
				bar.addEventListener('click', function(event) {
					event.stopPropagation();
				});
				// mêmes couleurs que le widget, quel que soit le thème, mais opaques : un fond transparent laisserait voir le widget dessous
				var style = window.getComputedStyle(root);
				var rgb = (style.backgroundColor || '').match(/rgba?\(\s*([\d.]+)[\s,]+([\d.]+)[\s,]+([\d.]+)(?:[\s,\/]+([\d.]+%?))?/);
				var alpha = (rgb && rgb[4] !== undefined) ? parseFloat(rgb[4]) / (rgb[4].indexOf('%') != -1 ? 100 : 1) : 1;
				bar.style.backgroundColor = (rgb && alpha > 0) ? 'rgb(' + rgb[1] + ', ' + rgb[2] + ', ' + rgb[3] + ')' : '#fff';
				bar.style.color = (rgb && alpha > 0) ? style.color : '#333';
				root.appendChild(bar);
				var timer = setTimeout(function() { bar.remove(); }, 30000); // sans réponse : abandon
			};
			var run = function(id) {
				if (!id || jeedom.cmd.disableExecute) return;
				if (!confirm.cmds[id]) {
					jeedom.cmd.execute({id: id});
					return;
				}
				ask(confirm.cmds[id], function() {
					jeedom.cmd.execute({id: id, confirmAction: 1});
				});
			};
			// boutons des commandes action (widgets du core) : la question passe avant leur propre clic. Seulement les actions
			// simples (sous-type other) : un curseur, une liste ou un message envoient une valeur que seul leur widget connaît,
			// le core garde alors sa question générique.
			root.addEventListener('click', function(event) {
				var cmd = event.target.closest('.cmd[data-cmd_id]');
				if (!cmd || !root.contains(cmd) || jeedom.cmd.disableExecute) return;
				if ((cmd.getAttribute('data-subtype') || 'other') != 'other') return;
				var id = cmd.getAttribute('data-cmd_id');
				if (!confirm.cmds[id]) return;
				event.stopPropagation();
				event.preventDefault();
				run(id);
			}, true);
			var button = root.querySelector('.hw-switch');
			if (button) {
				button.addEventListener('click', function() {
					run(button.classList.contains('hw-on') ? button.getAttribute('data-hw_off') : button.getAttribute('data-hw_on'));
				});
			}
		})();
	</script>
</div>
